  try{
    res=await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(cleaned)}`,{cache:'no-store'});
  }catch(e){
    console.warn('ZIP lookup unavailable; accepting 5-digit ZIP for beta.', e);
    return {zip:cleaned, city:'', state:'', verified:false};
  }
  if(!res.ok){
    /* In beta, do not block a real user if the public ZIP lookup is unavailable, rate-limited, or missing a valid ZIP. */
    console.warn('ZIP lookup did not confirm ZIP; accepting format for beta.', cleaned, res.status);
    return {zip:cleaned, city:'', state:'', verified:false};
  }
  const data=await res.json();
  const place=(data.places&&data.places[0])||{};

    zip:cleaned,
    city:place['place name']||'',
    state:place['state abbreviation']||'',
    verified:true
  };

function lastPurchaseBefore(productId,date){return state.purchases.filter(x=>x.product_id===productId&&new Date(x.purchase_date)<=new Date(date)).sort((a,b)=>new Date(b.purchase_date)-new Date(a.purchase_date))[0]||latestPurchase(productId)||null}
async function syncProductFromLatestPurchase(productId){const lp=latestPurchase(productId);if(!lp)return;await updateProduct(productId,{brand:lp.brand,size_value:lp.size_value,size_unit:lp.size_unit,quantity:lp.quantity,purchase_price:lp.price,store:lp.store,last_purchase_date:lp.purchase_date,household_id:lp.household_id||state.selectedHouseholdId})}
function enrich(p){const purchases=state.purchases.filter(x=>x.product_id===p.id).sort((a,b)=>new Date(a.purchase_date)-new Date(b.purchase_date));const events=state.events.filter(x=>x.product_id===p.id).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date));const finished=events.filter(e=>e.event_type==='finished'&&num(e.days_lasted)>0);let avg=num(p.default_usage_days,30);if(finished.length)avg=Math.round(finished.reduce((s,e)=>s+num(e.days_lasted),0)/finished.length);else if(purchases.length>=2){const intervals=[];for(let i=1;i<purchases.length;i++)intervals.push(Math.max(1,daysBetween(purchases[i-1].purchase_date,purchases[i].purchase_date)));if(intervals.length)avg=Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length)}const last=purchases[purchases.length-1]||null;const lastDate=last?.purchase_date||p.last_purchase_date||todayISO();const lastPrice=num(last?.price??p.purchase_price,0);const runoutDate=addDays(lastDate,avg);const daysUsed=Math.max(0,daysBetween(lastDate,todayISO()));const daysLeft=daysBetween(todayISO(),runoutDate);const percentUsed=Math.min(100,Math.max(0,Math.round(daysUsed/Math.max(avg,1)*100)));const reminder=num(p.reminder_days,7);let status='good',statusLabel=`${daysLeft}d left`;if(daysLeft<0){status='bad';statusLabel=`Overdue ${Math.abs(daysLeft)}d`}else if(daysLeft<=reminder){status='warn'}return{...p,purchases,events,avgDays:avg,lastDate,lastPrice,runoutDate,daysUsed,daysLeft,percentUsed,reminderDays:reminder,status,statusLabel,costPerDay:avg?lastPrice/avg:0}}
function products(){return selectedProductsRaw().map(enrich).sort((a,b)=>a.daysLeft-b.daysLeft)}

me="household_size" type="number" min="1" data-signup-required placeholder="5"></div><div class="field"><label>Adults</label><input name="adults" type="number" min="0" placeholder="2"></div><div class="field"><label>Kids</label><input name="kids" type="number" min="0" placeholder="3"></div><div class="field"><label>Pets</label><input name="pets" type="number" min="0" placeholder="0"></div><div class="field full"><label>Home type</label><select name="home_type">${homeTypes.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('')}</select></div><div class="field full"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:750"><input name="consent" type="checkbox" data-signup-required style="width:auto;margin-top:4px"> I understand my product and usage data will be stored in the ReplenishIQ cloud database and may be used only in anonymized, grouped insights.</label></div></div></div><div class="field full"><button class="btn full" id="authSubmit" type="submit">Sign in</button></div></form><div style="height:10px"></div><button class="btn secondary full" data-action="local-demo">Continue as local demo only</button></div></div>`;let mode='signin';function setAuthMode(next){mode=next;root.querySelectorAll('[data-auth-tab]').forEach(x=>x.className='btn secondary');root.querySelector(`[data-auth-tab="${mode}"]`).className='btn blue';document.getElementById('authSubmit').textContent=mode==='signin'?'Sign in':'Create account';const fields=document.getElementById('signupProfileFields');fields.classList.toggle('hide',mode!=='signup');fields.querySelectorAll('[data-signup-required]').forEach(el=>{el.required=mode==='signup'})}root.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>setAuthMode(b.dataset.authTab));const authFormEl=document.getElementById('authForm');authFormEl.addEventListener('input',e=>clearAuthFieldError(e.target));authFormEl.addEventListener('change',e=>clearAuthFieldError(e.target));authFormEl.onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;clearAuthErrors(form);const f=new FormData(form),email=(f.get('email')||'').trim(),password=f.get('password')||'';try{if(!requireAuthValue(form,'email','Please enter your email address.'))return;if(!/^\S+@\S+\.\S+$/.test(email))return focusAuthField(form.querySelector('[name="email"]'),'Please enter a valid email address.');if(!requireAuthValue(form,'password','Please enter your password.'))return;if(String(password).length<6)return focusAuthField(form.querySelector('[name="password"]'),'Password must be at least 6 characters.');if(mode==='signup'){if(!requireAuthValue(form,'household_name','Please enter the first household name.'))return;if(!requireAuthValue(form,'zip_code','Please enter the ZIP code.'))return;const zipInput=form.querySelector('[name="zip_code"]');const zipClean=normalizeZip(f.get('zip_code'));if(!validZip(zipClean))return focusAuthField(zipInput,'Please enter a valid 5-digit U.S. ZIP code.');if(!requireAuthValue(form,'household_size','Please enter the total household size.'))return;const sizeInput=form.querySelector('[name="household_size"]');if(num(f.get('household_size'),0)<1)return focusAuthField(sizeInput,'Household size must be at least 1.');if(!requireAuthValue(form,'consent','Please check the consent box to create an account.'))return;const profileData={display_name:(f.get('display_name')||'').trim(),household_name:(f.get('household_name')||'Home').trim(),zip_code:zipClean,city:(f.get('city')||'').trim(),state:(f.get('state')||'').trim(),household_size:f.get('household_size')||null,adults:f.get('adults')||null,kids:f.get('kids')||null,pets:f.get('pets')||null,home_type:f.get('home_type')||'',consent_at:new Date().toISOString()};const zipInfo=await verifyRealZip(profileData.zip_code);profileData.zip_code=zipInfo.zip;profileData.city=zipInfo.city||profileData.city;profileData.state=zipInfo.state||profileData.state;localStorage.setItem(PENDING_PROFILE_KEY,JSON.stringify({email,...profileData}));const{error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin,data:profileData}});if(error)throw error;toast('Account created. Check email if verification is required.')}else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;toast('Signed in.')}}catch(err){toast(err.message||'Auth error')}};const localBtn=root.querySelector('[data-action="local-demo"]');if(localBtn)localBtn.onclick=()=>{loadLocalDemo();state.local=true;state.mode='local';render()}}
function renderSetupError(){root.innerHTML=`<div class="auth-shell"><div class="auth-card"><div class="logo">R</div><h1>Supabase setup needed.</h1><p>The app connected to Supabase, but the database tables or security policies are not ready yet.</p><div class="notice red"><strong>Error:</strong> ${esc(state.setupError)}</div><p>Run the latest multi-household SQL patch in Supabase SQL Editor, then refresh this app.</p><button class="btn full" onclick="location.reload()">Refresh app</button><div style="height:10px"></div><button class="btn secondary full" data-action="signout">Sign out</button></div></div>`;root.querySelector('[data-action="signout"]').onclick=()=>sb.auth.signOut()}
function nav(route,icon,label){return`<button class="nav-item ${state.route===route?'active':''}" data-route="${route}"><span>${icon}</span>${label}</button>`}
function route(ps){if(state.route==='items')return itemsView(ps);if(state.route==='insights')return insightsView(ps);if(state.route==='data')return dataView(ps);if(state.route==='settings')return settingsView(ps);if(state.route==='admin')return adminView();return homeView(ps)}
function monthlySpend(p){return num(p.costPerDay,0)*30}
function sortProducts(ps,sort){const arr=[...ps];const key=sort||'urgent_asc';arr.sort((a,b)=>{if(key==='urgent_desc')return b.daysLeft-a.daysLeft;if(key==='spend_desc')return monthlySpend(b)-monthlySpend(a);if(key==='spend_asc')return monthlySpend(a)-monthlySpend(b);return a.daysLeft-b.daysLeft});return arr}
function sortSelect(id,value){return`<select id="${id}" aria-label="Sort products"><option value="urgent_asc" ${value==='urgent_asc'?'selected':''}>Most urgent → least urgent</option><option value="urgent_desc" ${value==='urgent_desc'?'selected':''}>Least urgent → most urgent</option><option value="spend_desc" ${value==='spend_desc'?'selected':''}>Monthly spending high → low</option><option value="spend_asc" ${value==='spend_asc'?'selected':''}>Monthly spending low → high</option></select>`}
function householdChips(){if(!state.households.length)return'<p>No households yet.</p>';return`<div class="household-chip-row">${state.households.map(h=>`<button class="household-chip ${h.id===state.selectedHouseholdId?'active':''}" data-action="household-select" data-id="${h.id}">${esc(h.name||'Household')}${h.zip_code?` · ${esc(h.zip_code)}`:''}</button>`).join('')}</div>`}
function homeView(ps){const h=selectedHousehold();const urgent=ps.filter(p=>p.daysLeft<=p.reminderDays).sort((a,b)=>a.daysLeft-b.daysLeft);const spend=ps.reduce((s,p)=>s+monthlySpend(p),0);return`<section class="section"><div class="home-actions"><button class="btn secondary full" data-action="household-add">+ Add household</button><button class="btn full" data-action="add">+ Add product</button></div><div class="card"><div class="section-head"><div><h2>Selected household</h2><p>Switch households to change the dashboard, items, history, and insights.</p></div></div>${householdSelector('home-household-select')}<div style="height:10px"></div><p>${householdSummary(h)}</p></div></section>${legacyData()&&!state.local?`<div class="notice blue"><strong>Beta data found:</strong> this browser has older local beta data. <button class="btn small blue" data-action="migrate">Move beta data to cloud</button></div>`:''}<section class="grid two section"><div class="card"><h3>Monthly spending</h3><p>Estimated for ${esc(h?.name||'this household')} based on cost-per-day.</p><h2>${money(spend)}</h2></div><div class="card"><h3>Items tracked</h3><p>Active replenishment products for this household.</p><h2>${ps.length}</h2></div></section><section class="section"><div class="section-head"><div><h2>Urgent restocks only</h2><p>Items that are overdue or inside their reminder window.</p></div></div>${urgent.length?`<div class="collapse-list">${urgent.map(p=>itemCard(p,false,true)).join('')}</div>`:empty('✅','Nothing urgent right now','No products in this household are currently overdue or near their reminder window.')}</section>`}
function householdSummary(h){if(!h)return'No household selected';let parts=[h.zip_code,h.city&&h.state?`${h.city}, ${h.state}`:null,h.household_size?`${h.household_size} people`:null,h.home_type].filter(Boolean);return parts.length?parts.join(' · '):'Profile incomplete'}

function insightsView(ps){const mode=state.insightMode||'product';return`<section class="section"><div class="section-head"><div><h2>Insights</h2><p>Use product-level insights for item performance, or household-level insights to compare households.</p></div></div><div class="insight-toggle"><button class="${mode==='product'?'active':''}" data-insight-mode="product">Product level insights</button><button class="${mode==='household'?'active':''}" data-insight-mode="household">Household level insights</button></div>${mode==='household'?householdLevelInsights():productLevelInsights(ps)}</section>`}
function productLevelInsights(ps){const sorted=sortProducts(ps,state.insightSort);return`<div class="toolbar"><strong>${esc(selectedHousehold()?.name||'Selected household')}</strong><label>Sort by ${sortSelect('insightSort',state.insightSort)}</label></div>${sorted.length?`<div class="collapse-list">${sorted.map(p=>itemCard(p,true)).join('')}</div>`:empty('📊','No product insights yet','Add products and log restocks/finished dates to start building product-level insights.')}`}
function householdLevelInsights(){const rows=state.households.map(h=>{const hps=state.products.filter(p=>p.active!==false&&(p.household_id===h.id||(!p.household_id&&h.id===state.households[0]?.id))).map(enrich);return{h,products:hps,spend:hps.reduce((s,p)=>s+monthlySpend(p),0),count:hps.length}}).sort((a,b)=>b.spend-a.spend);const common=commonHouseholdItems();return`<div class="grid two"><div class="card"><h3>Household spending comparison</h3><p>Average monthly estimate by household.</p>${rows.length?`<div class="grid">${rows.map(r=>`<div><div class="meta"><span>${esc(r.h.name||'Household')}</span><strong>${money(r.spend)}</strong></div><div class="progress"><div class="bar" style="width:${Math.min(100,Math.round((r.spend/Math.max(1,rows[0].spend))*100))}%"></div></div><p style="margin-top:6px">${r.count} tracked items · ${householdSummary(r.h)}</p></div>`).join('')}</div>`:'<p>No households yet.</p>'}</div><div class="card"><h3>Items tracked in multiple households</h3><p>Shows usage/spend differences where the same item is tracked across households.</p>${common.length?`<div class="grid">${common.map(item=>`<div class="mini-card"><h3>${esc(item.name)}</h3>${item.rows.map(r=>`<div class="meta"><span>${esc(r.household)}</span><strong>${r.avgDays}d · ${money(r.spend)}/mo</strong></div>`).join('')}</div>`).join('')}</div>`:'<p>No common items yet. Track the same product in multiple households to compare usage.</p>'}</div></div>`}
function commonHouseholdItems(){const map={};state.products.filter(p=>p.active!==false).forEach(p=>{const key=(p.product_name||'').trim().toLowerCase();if(!key)return;const ep=enrich(p),h=householdName(p.household_id);map[key]=map[key]||{name:p.product_name,rows:[]};map[key].rows.push({household:h,avgDays:ep.avgDays,spend:monthlySpend(ep)})});return Object.values(map).filter(x=>x.rows.length>1).slice(0,10)}
function trendInfo(p){const purchases=(p.purchases||[]).slice().sort((a,b)=>new Date(a.purchase_date)-new Date(b.purchase_date));const switches=(p.events||[]).filter(e=>e.event_type==='brand_switch');let messages=[];if(purchases.length>=2){const first=purchases[0],last=purchases[purchases.length-1];const firstCost=num(first.price,0)/Math.max(1,p.avgDays)*30,lastCost=num(last.price,0)/Math.max(1,p.avgDays)*30;const diff=lastCost-firstCost;if(Math.abs(diff)>=.5)messages.push(diff>0?`Monthly spend is up about ${money(diff)} since tracking began, mainly from higher latest purchase cost.`:`Monthly spend is down about ${money(Math.abs(diff))} since tracking began, likely from lower latest purchase cost.`);else messages.push('Monthly spend is currently about even compared with the first tracked purchase.')}else messages.push('More purchase history is needed before spend-change insights become reliable.');if(switches.length){const sw=switches[switches.length-1];messages.push(`Latest brand test: ${esc(sw.old_brand||'previous brand')} → ${esc(sw.new_brand||'new brand')}. Future finished dates will show whether the switch improved usage.`)}return messages.join(' ')}
function pricePoints(p){const arr=(p.purchases||[]).slice().sort((a,b)=>new Date(a.purchase_date)-new Date(b.purchase_date)).map(x=>num(x.price,0));if(arr.length<2)return[num(p.lastPrice,0),num(p.lastPrice,0)];return arr.slice(-8)}
function miniChart(values){const vals=values.map(v=>num(v,0));const min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min);const pts=vals.map((v,i)=>`${(i/(Math.max(1,vals.length-1))*100).toFixed(1)},${(52-((v-min)/range)*44).toFixed(1)}`).join(' ');return`<div class="mini-chart"><svg viewBox="0 0 100 56" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></div>`}
function itemCard(p,insight=false,urgentOnly=false){const monthly=monthlySpend(p);const bar=p.status==='bad'?'bad':p.status==='warn'?'warn':'';const body=insight?`<div class="notice blue"><strong>What changed:</strong> ${trendInfo(p)}</div>${miniChart(pricePoints(p))}<div class="grid three"><div class="metric"><span>Monthly spend</span><strong>${money(monthly)}</strong></div><div class="metric"><span>Average cycle</span><strong>${p.avgDays}d</strong></div><div class="metric"><span>History points</span><strong>${(p.purchases||[]).length+(p.events||[]).length}</strong></div></div><button class="btn secondary full" data-action="details" data-id="${p.id}">Open full history</button>`:`<div><div class="progress"><div class="bar ${bar}" style="width:${p.percentUsed}%"></div></div><div class="progress-labels"><span>${p.percentUsed}% used</span><span>Run-out: ${esc(p.runoutDate)}</span></div></div><div class="grid three"><div class="metric"><span>Brand</span><strong style="font-size:18px">${esc(p.brand||'—')}</strong></div><div class="metric"><span>Average cycle</span><strong>${p.avgDays}d</strong></div><div class="metric"><span>Cost/day</span><strong>${money(p.costPerDay)}</strong></div></div><div class="action-row"><button class="btn secondary" data-action="details" data-id="${p.id}">Details</button><button class="btn green" data-action="reorder" data-id="${p.id}">Restock</button><button class="btn warn" data-action="finished" data-id="${p.id}">Finish date</button><button class="btn secondary" data-action="switch" data-id="${p.id}">Switch brand</button></div>`;return`<details class="item-collapse" ${urgentOnly?'open':''}><summary><div class="summary-grid"><div><h3>${esc(p.product_name)}</h3><p>${esc(p.brand||'Unknown brand')} · ${esc(p.category||'Other')}</p></div><div class="summary-metric"><span>Avg days left</span><strong>${esc(p.statusLabel)}</strong></div><div class="summary-metric"><span>Avg monthly spend</span><strong>${money(monthly)}</strong></div><div class="chev">⌄</div></div></summary><div class="collapse-body">${body}</div></details>`}

ehold currently selected.</p><div class="share-box">${esc(JSON.stringify(scopedData,null,2).slice(0,2200))}${JSON.stringify(scopedData).length>2200?'\n...':''}</div></details></div></section>`}

function adminUserManagement(users,households,products,purchases,events){const countBy=(rows,key)=>{const m={};(rows||[]).forEach(r=>{const v=r&&r[key];if(v)m[v]=(m[v]||0)+1});return m};const householdCounts=countBy(households,'user_id'),productCounts=countBy(products,'user_id'),purchaseCounts=countBy(purchases,'user_id'),eventCounts=countBy(events,'user_id');const rows=[...(users||[])].sort((a,b)=>String(a.email||'').localeCompare(String(b.email||'')));return rows.length?`<div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Households</th><th>Products</th><th>History</th><th>Action</th></tr></thead><tbody>${rows.map(u=>{const isMe=u.id===state.user?.id;const h=householdCounts[u.id]||0,pr=productCounts[u.id]||0,pu=purchaseCounts[u.id]||0,ev=eventCounts[u.id]||0;return`<tr><td><strong>${esc(u.email||u.display_name||u.id)}</strong><br><span style="color:var(--muted);font-size:12px">${esc(u.id)}</span></td><td>${esc(u.role||'user')}</td><td>${h}</td><td>${pr}</td><td>${pu+ev}</td><td>${isMe?'<span class="status info">Current admin</span>':`<button class="btn small danger" data-action="admin-user-delete" data-id="${u.id}">Delete account</button>`}</td></tr>`}).join('')}</tbody></table></div>`:'<p>No user profiles found.</p>'}
function adminHouseholdManagement(households,users,products){const emailById={};users.forEach(u=>emailById[u.id]=u.email||u.display_name||u.id);const countByUser={};households.forEach(h=>{if(h.user_id)countByUser[h.user_id]=(countByUser[h.user_id]||0)+1});const rows=[...households].sort((a,b)=>String(emailById[a.user_id]||'').localeCompare(String(emailById[b.user_id]||'')));return rows.length?`<div class="table-wrap"><table><thead><tr><th>User</th><th>Household</th><th>ZIP</th><th>Items</th><th>Action</th></tr></thead><tbody>${rows.map(h=>{const itemCount=products.filter(p=>p.household_id===h.id&&p.active!==false).length;const only=countByUser[h.user_id]<=1;return`<tr><td>${esc(emailById[h.user_id]||h.user_id||'Unknown')}</td><td>${esc(h.name||'Household')}</td><td>${esc(h.zip_code||'')}</td><td>${itemCount}</td><td><button class="btn small danger" data-action="admin-household-delete" data-id="${h.id}">${only?'Delete household + account':'Delete household'}</button></td></tr>`}).join('')}</tbody></table></div>`:'<p>No households found.</p>'}
function adminView(){if(state.profile?.role!=='admin')return`<section class="section"><div class="card"><h3>Admin access required</h3><p>Your profile role is not admin.</p></div></section>`;const a=state.admin||{},households=a.households||[],products=a.products||[],users=a.profiles||[],purchases=a.purchases||[],events=a.events||[];const topBrands=countTop(products.map(p=>p.brand).filter(Boolean)),topCats=countTop(products.map(p=>p.category).filter(Boolean)),topZips=countTop(households.map(h=>h.zip_code).filter(Boolean)),topHomes=countTop(households.map(h=>h.home_type).filter(Boolean));const avgHousehold=Math.round((households.filter(h=>num(h.household_size,0)>0).reduce((s,h)=>s+num(h.household_size,0),0)/Math.max(1,households.filter(h=>num(h.household_size,0)>0).length))*10)/10;return`<section class="section"><div class="section-head"><div><h2>Admin insights</h2><p>Aggregated database overview across users and households.</p></div><button class="btn secondary" data-action="refresh-admin">Refresh</button></div>${state.adminError?`<div class="notice red">${esc(state.adminError)}</div>`:''}<div class="grid three"><div class="card"><h3>Users</h3><h2>${users.length}</h2><p>Profiles in database.</p></div><div class="card"><h3>Households</h3><h2>${households.length}</h2><p>Household profiles.</p></div><div class="card"><h3>Tracked products</h3><h2>${products.length}</h2><p>Total product rows.</p></div></div><div class="grid three section"><div class="card"><h3>Avg household size</h3><h2>${Number.isFinite(avgHousehold)?avgHousehold:'—'}</h2><p>Based on household profiles.</p></div><div class="card"><h3>Top ZIP codes</h3>${simpleList(topZips)}</div><div class="card"><h3>Home types</h3>${simpleList(topHomes)}</div></div><div class="grid two section"><div class="card"><h3>Top categories</h3>${simpleList(topCats)}</div><div class="card"><h3>Top brands</h3>${simpleList(topBrands)}</div></div><div class="card section"><h3>Admin user management</h3><p style="color:var(--muted);margin-top:0">Use this to delete a test user directly from the admin account, even if the user has zero households left. This deletes the Supabase Auth login and all ReplenishIQ data for that user.</p>${adminUserManagement(users,households,products,purchases,events)}</div><div class="card section"><h3>Admin household management</h3><p style="color:var(--muted);margin-top:0">If an admin deletes a user's only household, the app will delete that user's full account and app data. Regular users cannot delete their only household.</p>${adminHouseholdManagement(households,users,products)}</div><div class="card section"><h3>Recent feedback</h3>${feedbackTable(a.feedback||[])}</div></section>`}

function finishedEventForm(e){const product=state.products.find(p=>p.id===e.product_id)||{};modal(`<div class="modal-head"><div><h2>Edit finished date</h2><p>Correct the date and the app recalculates days lasted.</p></div><button class="icon-btn" data-close>×</button></div><form id="finishEdit" class="form-grid">${field('Finished date','event_date',e.event_date||todayISO(),'','date',true)}<div class="field full"><label>Notes</label><textarea name="notes">${esc(e.notes||'')}</textarea></div><div class="field full"><button class="btn full">Save finished date</button></div></form>`);document.getElementById('finishEdit').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget),date=f.get('event_date'),lp=lastPurchaseBefore(e.product_id,date),lastDate=lp?.purchase_date||product.last_purchase_date||date,days=Math.max(1,daysBetween(lastDate,date));await updateEvent(e.id,{event_date:date,days_lasted:days,purchase_id:lp?.id||null,notes:f.get('notes').trim()||`Finished after ${days} days.`});await refreshAfterSave();close();detail(e.product_id);toast('Finished date updated.')}}
function brandEventForm(e){const product=state.products.find(p=>p.id===e.product_id)||{};const same=e.same_size===false?'no':'yes';modal(`<div class="modal-head"><div><h2>Edit brand switch</h2><p>Correct brand, date, or package size.</p></div><button class="icon-btn" data-close>×</button></div><form id="brandEventEdit" class="form-grid">${field('Switch date','event_date',e.event_date||todayISO(),'','date',true)}${field('Old brand','old_brand',e.old_brand||'','','text',true)}${field('New brand','new_brand',e.new_brand||'','','text',true)}<div class="field full"><label>Was the new package the same size?</label><select name="same_size" id="editSame"><option value="yes" ${same==='yes'?'selected':''}>Yes</option><option value="no" ${same==='no'?'selected':''}>No</option></select></div><div id="editSizeBox" class="field full ${same==='no'?'':'hide'}"><div class="form-grid">${field('New size / amount','new_size_value',e.new_size_value||product.size_value||'','','number')}${field('New unit','new_size_unit',e.new_size_unit||product.size_unit||'','','text')}${field('Quantity bought','new_quantity',e.new_quantity||product.quantity||1,'1','number')}</div></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(e.notes||'')}</textarea></div><div class="field full"><button class="btn full">Save corrected brand switch</button></div></form>`);document.getElementById('editSame').onchange=ev=>document.getElementById('editSizeBox').classList.toggle('hide',ev.target.value!=='no');document.getElementById('brandEventEdit').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget),same=f.get('same_size')==='yes';const newSizeValue=same?(e.old_size_value||product.size_value):num(f.get('new_size_value'),null),newSizeUnit=same?(e.old_size_unit||product.size_unit):f.get('new_size_unit').trim(),newQuantity=same?(product.quantity||1):num(f.get('new_quantity'),1);if(!same&&(!newSizeValue||!newSizeUnit)){toast('Enter corrected size and unit.');return}const patch={event_date:f.get('event_date'),old_brand:f.get('old_brand').trim(),new_brand:f.get('new_brand').trim(),same_size:same,new_size_value:newSizeValue,new_size_unit:newSizeUnit,new_quantity:newQuantity,notes:f.get('notes').trim()};await updateEvent(e.id,patch);if(e.purchase_id){await updatePurchase(e.purchase_id,{brand:patch.new_brand,size_value:newSizeValue,size_unit:newSizeUnit,quantity:newQuantity,purchase_date:patch.event_date});await syncProductFromLatestPurchase(e.product_id)}await refreshAfterSave();close();detail(e.product_id);toast('Brand switch updated.')}}
function genericEventForm(e){modal(`<div class="modal-head"><div><h2>Edit history</h2></div><button class="icon-btn" data-close>×</button></div><form id="genericEvent" class="form-grid">${field('Date','event_date',e.event_date||todayISO(),'','date',true)}<div class="field full"><label>Notes</label><textarea name="notes">${esc(e.notes||'')}</textarea></div><div class="field full"><button class="btn full">Save</button></div></form>`);document.getElementById('genericEvent').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);await updateEvent(e.id,{event_date:f.get('event_date'),notes:f.get('notes').trim()});await refreshAfterSave();close();detail(e.product_id)}}

function householdForm(id=null){const h=state.households.find(x=>x.id===id)||{};const isEdit=!!id;modal(`<div class="modal-head"><div><h2>${isEdit?'Edit household':'Add household'}</h2><p>Products, history, and insights are separated by household.</p></div><button class="icon-btn" data-close>×</button></div><form id="householdForm" class="form-grid" novalidate>${field('Household name','name',h.name||'','Home / Office / Parents','text',true)}<div class="field"><label>ZIP code</label><input name="zip_code" value="${esc(h.zip_code||'')}" placeholder="11229" type="text" inputmode="numeric" maxlength="5" required><p style="font-size:12px;color:var(--muted);margin:6px 0 0">Enter a 5-digit U.S. ZIP code. City/state may be normalized from the ZIP.</p></div>${field('City','city',h.city||'','Brooklyn')}${field('State','state',h.state||'','NY')}${field('Total household size','household_size',h.household_size||'','5','number',true)}${field('Adults','adults',h.adults||'','2','number')}${field('Kids','kids',h.kids||'','3','number')}${field('Pets','pets',h.pets||'','0','number')}${selectField('Home type','home_type',homeTypes,h.home_type||homeTypes[0])}<div class="field full"><button class="btn full">${isEdit?'Save household':'Add household'}</button></div></form>`);enableFormDraft('householdForm',{id:id||null},'householdForm');document.getElementById('householdForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const patch={name:f.get('name').trim(),zip_code:normalizeZip(f.get('zip_code')),city:(f.get('city')||'').trim()||null,state:(f.get('state')||'').trim()||null,household_size:num(f.get('household_size'),null),adults:num(f.get('adults'),null),kids:num(f.get('kids'),null),pets:num(f.get('pets'),null),home_type:f.get('home_type')||null,active:true};if(!patch.name||!patch.household_size){toast('Household name and household size are required.');return}let zipInfo;try{zipInfo=await verifyRealZip(patch.zip_code)}catch(err){toast(err.message||'ZIP code could not be verified.');return}patch.zip_code=zipInfo.zip;patch.city=zipInfo.city||patch.city;patch.state=zipInfo.state||patch.state;if(isEdit){await updateHousehold(id,patch)}else{const row={id:uid(),user_id:state.user?.id||'local',...patch,is_default:false,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};const saved=await saveHousehold(row);state.selectedHouseholdId=saved.id;localStorage.setItem(selectedStoreKey(),saved.id)}await refreshAfterSave();close();toast(isEdit?'Household saved.':'Household added.')}}
function feedbackForm(){modal(`<div class="modal-head"><div><h2>Send feedback</h2><p>Tell us what feels confusing, useful, ugly, or missing.</p></div><button class="icon-btn" data-close>×</button></div><form id="feedbackForm" class="form-grid"><div class="field"><label>Rating</label><select name="rating"><option value="5">5 - very useful</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1 - not useful</option></select></div><div class="field full"><label>Feedback</label><textarea name="message" required placeholder="What should change?"></textarea></div><div class="field full"><button class="btn full">Submit feedback</button></div></form>`);enableFormDraft('feedbackForm',{},'feedbackForm');document.getElementById('feedbackForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget),row={id:uid(),user_id:state.user?.id||null,household_id:state.selectedHouseholdId,message:f.get('message').trim(),rating:num(f.get('rating'),null),page:state.route,created_at:new Date().toISOString()};if(state.local){toast('Feedback not saved in local demo.');close();return}const{error}=await sb.from('feedback').insert(row);if(error){reportError(error,'Cloud save failed');throw error}close();toast('Feedback saved.')}}
async function seed(){const samples=[['Laundry detergent','Household','Tide',92,'fl oz',1,18.99,'Walmart',37],['Paper towels','Household','Bounty',12,'rolls',1,22.49,'Costco',26],['Toothpaste','Personal Care','Crest',5.7,'oz',2,7.99,'Amazon',58]];for(const s of samples){const id=uid(),user_id=state.user?.id||'local',household_id=state.selectedHouseholdId,purchaseDate=addDays(todayISO(),-Math.floor(Math.random()*20)-5);await saveProduct({id,user_id,household_id,product_name:s[0],category:s[1],brand:s[2],size_value:s[3],size_unit:s[4],quantity:s[5],purchase_price:s[6],store:s[7],last_purchase_date:purchaseDate,default_usage_days:s[8],reminder_days:7,active:true,created_at:new Date().toISOString()});await savePurchase({id:uid(),user_id,household_id,product_id:id,brand:s[2],size_value:s[3],size_unit:s[4],quantity:s[5],price:s[6],store:s[7],purchase_date:purchaseDate,created_at:new Date().toISOString()})}await refreshAfterSave();toast('Sample data added to selected household.')}
function exportData(){const ids=selectedProductIds();const blob=new Blob([JSON.stringify({household:selectedHousehold(),products:state.products.filter(p=>ids.has(p.id)),purchases:state.purchases.filter(p=>ids.has(p.product_id)),events:state.events.filter(e=>ids.has(e.product_id)),exported_at:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`replenishiq-${(selectedHousehold()?.name||'household').replace(/[^a-z0-9]+/gi,'-')}-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importJsonForm(){modal(`<div class="modal-head"><div><h2>Import JSON backup</h2><p>Paste a backup export. This will add records to the currently selected household.</p></div><button class="icon-btn" data-close>×</button></div><form id="importForm" class="form-grid"><div class="field full"><label>JSON backup</label><textarea name="json" required style="min-height:220px"></textarea></div><div class="field full"><button class="btn full">Import backup</button></div></form>`);enableFormDraft('importJsonForm',{},'importForm');document.getElementById('importForm').onsubmit=async ev=>{ev.preventDefault();const data=JSON.parse(new FormData(ev.currentTarget).get('json'));await importData(data);close();toast('Backup imported into selected household.')}}
async function importData(data){const user_id=state.user?.id||'local',household_id=state.selectedHouseholdId,idMap={};for(const p of data.products||[]){const newId=uid();idMap[p.id]=newId;await saveProduct({...p,id:newId,user_id,household_id,created_at:p.created_at||new Date().toISOString(),updated_at:new Date().toISOString()})}for(const p of data.purchases||[]){if(idMap[p.product_id])await savePurchase({...p,id:uid(),user_id,household_id,product_id:idMap[p.product_id],created_at:p.created_at||new Date().toISOString()})}for(const e of data.events||[]){if(idMap[e.product_id])await saveEvent({...e,id:uid(),user_id,household_id,product_id:idMap[e.product_id],purchase_id:null,created_at:e.created_at||new Date().toISOString()})}await refreshAfterSave()}
async function migrateLegacy(){const data=legacyData();if(!data){toast('No old beta data found.');return}if(!confirm(`Move old local beta data from this browser into ${householdName(state.selectedHouseholdId)}?`))return;await importData(data);localStorage.setItem(`${LEGACY_STORE_KEY}_migrated_${todayISO()}`,JSON.stringify(data));toast('Old beta data copied to selected household.')}

boot();

<script>
// Defensive ZIP validation cleanup: ensure browser native pattern is a safe numeric pattern and does not get stuck on old custom errors.
document.addEventListener('input', function(e){
  const el=e.target;
  if(el && el.name==='zip_code'){
    el.value=(el.value||'').replace(/\D/g,'').slice(0,5);
    try{el.setCustomValidity('')}catch(_){}
    try{el.removeAttribute('pattern')}catch(_){}
  }
}, true);
document.addEventListener('focusin', function(e){
  const el=e.target;
  if(el && el.name==='zip_code'){
    try{el.setCustomValidity('')}catch(_){}
    try{el.removeAttribute('pattern')}catch(_){}
  }
}, true);
</script>

<script>
// Final defensive fix: disable native browser validation for all app forms and clear any saved pattern/title/custom ZIP validation.
(function(){
  function cleanZipFields(){
    document.querySelectorAll('input[name="zip_code"]').forEach(function(el){
      try{ el.removeAttribute('pattern'); el.removeAttribute('title'); el.removeAttribute('required'); el.setCustomValidity(''); }catch(_){ }
    });
    document.querySelectorAll('form').forEach(function(form){ try{ form.setAttribute('novalidate','novalidate'); }catch(_){ } });
  }
  document.addEventListener('submit', function(e){ cleanZipFields(); }, true);
  document.addEventListener('focusin', function(e){ cleanZipFields(); }, true);
  document.addEventListener('input', function(e){
    if(e.target && e.target.name==='zip_code'){
      e.target.value=(e.target.value||'').replace(/\D/g,'').slice(0,5);
      cleanZipFields();
    }
  }, true);
  setInterval(cleanZipFields, 500);
  cleanZipFields();
})();
</script>
